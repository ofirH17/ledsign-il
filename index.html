<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedSign IL - שלח טקסט</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
    .container { text-align: center; padding: 30px 20px; width: 100%; max-width: 480px; }
    .logo { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 30px; color: #4fc3f7; margin-bottom: 8px; }
    .tagline { color: #90caf9; margin-bottom: 24px; font-size: 14px; }
    .preview-box { background: #ffff00; color: #000; border-radius: 12px; padding: 20px; margin-bottom: 20px; font-size: 28px; font-weight: bold; letter-spacing: 2px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    button { background: linear-gradient(135deg, #4fc3f7, #0288d1); color: #fff; border: none; padding: 16px 32px; border-radius: 50px; font-size: 18px; cursor: pointer; width: 100%; margin-bottom: 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #f44336; margin-top: 12px; background: rgba(244,67,54,0.1); border: 1px solid rgba(244,67,54,0.3); padding: 10px; border-radius: 8px; }
    .success { color: #4caf50; margin-top: 12px; background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.3); padding: 10px; border-radius: 8px; }
    .hidden { display: none !important; }
    .status { margin-top: 12px; color: #90caf9; font-size: 14px; }
    .input-row { margin-bottom: 16px; text-align: right; }
    .input-row label { display: block; margin-bottom: 6px; color: #90caf9; font-size: 14px; }
    .input-row input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4fc3f7; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; }
    .input-row input::placeholder { color: #90caf9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">&#x1F6A6;</div>
    <h1>LedSign IL</h1>
    <p class="tagline">שלח טקסט למסך LED</p>

    <div class="input-row">
      <label>טקסט להצגה:</label>
      <input type="text" id="textInput" value="נהג חדש" placeholder="הכנס טקסט...">
    </div>

    <div class="preview-box" id="previewBox">נהג חדש</div>

    <button id="connectBtn" onclick="connectAndSend()">&#x1F4F2; התחבר ושלח למסך</button>
    <button id="sendBtn" onclick="sendImage()" class="hidden">&#x1F4E4; שלח שוב</button>

    <div id="status" class="status"></div>
    <div id="error" class="error hidden"></div>
    <div id="success" class="success hidden"></div>
  </div>

  <script>
    let device = null;
    let writeChar = null;

    const UUID_SERVICE = '0000fa00-0000-1000-8000-00805f9b34fb';
    const UUID_WRITE   = '0000fa02-0000-1000-8000-00805f9b34fb';
    const UUID_NOTIFY  = '0000fa03-0000-1000-8000-00805f9b34fb';

    document.getElementById('textInput').addEventListener('input', function() {
      document.getElementById('previewBox').textContent = this.value || 'טקסט';
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = 'שגיאה: ' + msg;
      el.classList.remove('hidden');
      document.getElementById('success').classList.add('hidden');
    }
    function showSuccess(msg) {
      const el = document.getElementById('success');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('error').classList.add('hidden');
    }

    async function connectAndSend() {
      document.getElementById('error').classList.add('hidden');
      document.getElementById('success').classList.add('hidden');
      const btn = document.getElementById('connectBtn');
      btn.disabled = true;

      try {
        setStatus('מחפש מסך LED...');
        device = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'LED' },
            { namePrefix: 'led' },
            { namePrefix: 'LEDBLE' },
            { namePrefix: 'LED_BLE' }
          ],
          optionalServices: [
            UUID_SERVICE,
            UUID_WRITE,
            UUID_NOTIFY,
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ffe5-0000-1000-8000-00805f9b34fb'
          ]
        });

        setStatus('מתחבר ל: ' + device.name + '...');
        const server = await device.gatt.connect();

        setStatus('מגלה שירותים...');
        const services = await server.getPrimaryServices();

        let foundWrite = false;
        for (const service of services) {
          setStatus('בודק שירות: ' + service.uuid);
          try {
            const chars = await service.getCharacteristics();
            for (const char of chars) {
              if (char.uuid === UUID_WRITE) {
                writeChar = char;
                foundWrite = true;
                setStatus('נמצא! UUID: ' + char.uuid);
              }
            }
          } catch(e) {}
        }

        if (!foundWrite) {
          // Try direct
          try {
            const svc = await server.getPrimaryService(UUID_SERVICE);
            writeChar = await svc.getCharacteristic(UUID_WRITE);
            foundWrite = true;
          } catch(e) {}
        }

        if (!foundWrite) {
          showError('לא נמצא characteristic לכתיבה. שירותים: ' + services.map(s=>s.uuid).join(', '));
          btn.disabled = false;
          return;
        }

        setStatus('מחובר! שולח תמונה...');
        await sendImage();
        document.getElementById('sendBtn').classList.remove('hidden');
        btn.textContent = '&#x1F504; התחבר מחדש';

      } catch(e) {
        showError(e.message || String(e));
        setStatus('');
      }
      btn.disabled = false;
    }

    async function sendImage() {
      if (!writeChar) { showError('לא מחובר'); return; }

      try {
        setStatus('מכין תמונה...');
        const text = document.getElementById('textInput').value || 'נהג חדש';
        const pngData = await createTextPNG(text, 128, 32);

        setStatus('שולח פקודת power on...');
        await sendCommand([0x05, 0x00, 0x07, 0x01, 0x01]);
        await sleep(200);

        setStatus('שולח brightness...');
        await sendCommand([0x05, 0x00, 0x04, 0x80, 100]);
        await sleep(200);

        setStatus('שולח תמונה PNG (' + pngData.length + ' bytes)...');
        await sendPNG(pngData, 1);
        await sleep(500);

        setStatus('בוחר screen 1...');
        await sendCommand([0x05, 0x00, 0x07, 0x80, 0x01]);

        showSuccess('נשלח בהצלחה! "' + text + '" מוצג על המסך');
        setStatus('');
      } catch(e) {
        showError('שגיאה בשליחה: ' + (e.message || String(e)));
      }
    }

    async function sendCommand(bytes) {
      await writeChar.writeValueWithoutResponse(new Uint8Array(bytes));
    }

    async function sendPNG(pngData, bufferNum) {
      const size = pngData.length;
      const crc = crc32(pngData);

      // Build packet: [LEN_L, LEN_H, CMD_L=0x02, CMD_H=0x00, 0x00, SIZE(4LE), CRC(4LE), 0x00, buffer, pngData...]
      const headerSize = 2 + 2 + 1 + 4 + 4 + 1 + 1; // 15 bytes
      const totalLen = headerSize + size;

      const packet = new Uint8Array(totalLen);
      let i = 0;
      packet[i++] = totalLen & 0xFF;
      packet[i++] = (totalLen >> 8) & 0xFF;
      packet[i++] = 0x02; // CMD_L
      packet[i++] = 0x00; // CMD_H
      packet[i++] = 0x00; // reserved/opt
      // size LE 4 bytes
      packet[i++] = size & 0xFF;
      packet[i++] = (size >> 8) & 0xFF;
      packet[i++] = (size >> 16) & 0xFF;
      packet[i++] = (size >> 24) & 0xFF;
      // crc LE 4 bytes
      packet[i++] = crc & 0xFF;
      packet[i++] = (crc >> 8) & 0xFF;
      packet[i++] = (crc >> 16) & 0xFF;
      packet[i++] = (crc >> 24) & 0xFF;
      packet[i++] = 0x00; // reserved
      packet[i++] = bufferNum;
      packet.set(pngData, i);

      // Send in 20-byte chunks
      const chunkSize = 20;
      for (let offset = 0; offset < packet.length; offset += chunkSize) {
        const chunk = packet.slice(offset, offset + chunkSize);
        await writeChar.writeValueWithoutResponse(chunk);
        await sleep(50);
      }
    }

    function crc32(data) {
      const table = makeCRCTable();
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < data.length; i++) {
        crc = (crc >>> 8) ^ table[(crc ^ data[i]) & 0xFF];
      }
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    function makeCRCTable() {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[i] = c;
      }
      return table;
    }

    async function createTextPNG(text, width, height) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // Yellow background
      ctx.fillStyle = '#FFFF00';
      ctx.fillRect(0, 0, width, height);

      // Black text
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Find best font size
      let fontSize = height - 4;
      ctx.font = 'bold ' + fontSize + 'px Arial';
      while (ctx.measureText(text).width > width - 4 && fontSize > 8) {
        fontSize -= 2;
        ctx.font = 'bold ' + fontSize + 'px Arial';
      }

      ctx.fillText(text, width / 2, height / 2);

      return new Promise(resolve => {
        canvas.toBlob(blob => {
          blob.arrayBuffer().then(buf => resolve(new Uint8Array(buf)));
        }, 'image/png');
      });
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  </script>
</body>
</html>
